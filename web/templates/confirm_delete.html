{{define "content"}}
<div class="form-wrap">
  <div class="form-card">
    <div class="form-header">
      <h2 class="modal-title">Confirmar Exclusão</h2>
    </div>
    <div style="padding:1.3rem 0;font-size:.92rem;color:var(--ts)">
      Excluir <strong style="color:var(--tx)">"{{.Name}}"</strong>?
      Esta ação não pode ser desfeita.
    </div>
    <form method="POST" action="{{.DeleteURL}}">
      <div style="display:flex;gap:.6rem;justify-content:flex-end">
        <a href="{{.BackURL}}" class="btn-ghost">Cancelar</a>
        <button type="submit" class="btn-primary" style="background:var(--rose);color:#fff">Excluir</button>
      </div>
    </form>
  </div>
</div>
{{end}}
